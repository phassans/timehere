<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 440px; height: 280px; background: #1e2530; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; overflow: hidden; position: relative; }

  .grid-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.04; }
  .glow { position: absolute; left: -10%; top: 5%; width: 50%; height: 90%; background: radial-gradient(ellipse, rgba(232,149,42,0.15) 0%, transparent 70%); pointer-events: none; }

  .left { display: flex; flex-direction: column; gap: 10px; z-index: 2; }
  .logo-row { display: flex; align-items: center; gap: 10px; }
  .wordmark { font-size: 20px; font-weight: 500; color: white; letter-spacing: -0.03em; }
  .headline { font-size: 15px; font-weight: 500; color: white; line-height: 1.3; letter-spacing: -0.02em; }
  .headline span { color: #E8952A; }
  .sub { font-size: 11px; color: rgba(255,255,255,0.45); line-height: 1.5; max-width: 180px; }

  .right { z-index: 2; }
  .tooltip { border-radius: 8px; overflow: hidden; min-width: 180px; }
  .tt-top { background: #2a3345; padding: 7px 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .tt-on { font-size: 8px; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 0.08em; }
  .tt-dot { font-size: 8px; color: rgba(255,255,255,0.15); }
  .tt-src { font-size: 9px; color: rgba(255,255,255,0.55); }
  .tt-time { font-family: 'SF Mono', monospace; font-size: 9px; color: rgba(255,255,255,0.4); }
  .tt-mid { background: #111; padding: 9px 12px; display: flex; flex-direction: column; gap: 6px; }
  .tt-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .tz-id { display: flex; align-items: center; gap: 5px; }
  .flag { font-size: 11px; }
  .abbr { font-size: 10px; color: rgba(255,255,255,0.4); }
  .conv { font-family: 'SF Mono', monospace; font-size: 11px; color: white; font-weight: 500; }
  .plus1d { font-size: 8px; background: rgba(232,149,42,0.2); color: #E8952A; padding: 1px 4px; border-radius: 3px; margin-left: 4px; }
</style>
</head>
<body>

  <svg class="grid-bg" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="0.5"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#g)"/>
  </svg>
  <div class="glow"></div>

  <!-- Left -->
  <div class="left">
    <div class="logo-row">
      <svg width="28" height="28" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
        <rect width="128" height="128" rx="26" fill="#E8952A"/>
        <circle cx="60" cy="62" r="30" fill="none" stroke="#1e2530" stroke-width="6" opacity="0.6"/>
        <line x1="60" y1="62" x2="47" y2="47" stroke="#1e2530" stroke-width="5" stroke-linecap="round"/>
        <line x1="60" y1="62" x2="90" y2="50" stroke="#1e2530" stroke-width="4" stroke-linecap="round"/>
        <polygon points="90,50 79,46 83,57" fill="#1e2530"/>
        <circle cx="60" cy="62" r="5" fill="#1e2530"/>
        <line x1="60" y1="34" x2="60" y2="40" stroke="#1e2530" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
        <line x1="86" y1="62" x2="80" y2="62" stroke="#1e2530" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
        <line x1="60" y1="90" x2="60" y2="84" stroke="#1e2530" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
        <line x1="34" y1="62" x2="40" y2="62" stroke="#1e2530" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
      </svg>
      <span class="wordmark">TimeHere</span>
    </div>
    <div class="headline">Hover any time.<br><span>See it in yours.</span></div>
    <div class="sub">Inline timezone conversion.<br>No copy-paste. No tab switching.</div>
  </div>

  <!-- Right: tooltip -->
  <div class="right">
    <div class="tooltip">
      <div class="tt-top">
        <div style="display:flex;align-items:center;gap:5px;">
          <span class="tt-on">on page</span>
          <span class="tt-dot">·</span>
          <span class="tt-src">🇺🇸 PT</span>
        </div>
        <span class="tt-time">1:30–3:00 PM</span>
      </div>
      <div class="tt-mid">
        <div class="tt-row">
          <div class="tz-id"><span class="flag">🇮🇳</span><span class="abbr">IST</span></div>
          <div style="display:flex;align-items:center;">
            <span class="conv">3:00–4:30 AM</span>
            <span class="plus1d">+1d</span>
          </div>
        </div>
        <div class="tt-row">
          <div class="tz-id"><span class="flag">🇺🇸</span><span class="abbr">ET</span></div>
          <span class="conv">4:30–6:00 PM</span>
        </div>
        <div class="tt-row">
          <div class="tz-id"><span class="flag">🇬🇧</span><span class="abbr">GMT</span></div>
          <span class="conv">9:30–11:00 PM</span>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
